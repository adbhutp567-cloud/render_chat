{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mx-auto max-w-md py-12">
    <div class="bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">{% trans "Set New Password" %}</h1>
        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
                    {% for error in form.non_field_errors %}
                        <p class="text-red-600 text-sm">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            {{ form.as_p }}

            <button type="submit" class="button w-full">{% trans "Reset Password" %}</button>
        </form>
    </div>
</div>
{% endblock %}
