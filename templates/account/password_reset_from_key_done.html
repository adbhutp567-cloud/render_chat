{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="container mx-auto max-w-md py-12">
    <div class="bg-white rounded-lg shadow-lg p-8 text-center">
        <h1 class="text-3xl font-bold mb-4 text-blue-600">{% trans "Password Reset Complete" %}</h1>
        <p class="text-gray-700 mb-6">{% trans "Your password has been set. You may now log in with your new password." %}</p>
        <a href="{% url 'account_login' %}" class="button inline-block">{% trans "Sign In" %}</a>
    </div>
</div>
{% endblock %}
